<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Tasks</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            padding: 50px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #222;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .task {
            background: white;
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;

            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);

            transition: 0.2s ease;
        }

        .task:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.10);
        }

        .task-title {
            font-size: 17px;
            color: #333;
            font-weight: 500;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .action-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 19px;
            cursor: pointer;

            transition: 0.2s ease;
        }

        .done-btn {
            background: #e8f8ee;
            color: #20a05a;
        }

        .done-btn:hover {
            background: #20a05a;
            color: white;
        }

        .delete-btn {
            background: #ffe8e8;
            color: #e53935;
        }

        .delete-btn:hover {
            background: #e53935;
            color: white;
        }

        .empty {
            background: white;
            border-radius: 14px;
            padding: 40px;
            text-align: center;
            color: #888;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.07);
        }
        .task.completed {
    border-left: 5px solid #20a05a;
    background: #eaf8ef;
}

.task.completed .task-title {
    color: #20a05a;
    text-decoration: line-through;
}

.task.completed .done-btn {
    background: #20a05a;
    color: white;
}
.add-task-btn {
    display: inline-block;
    margin-top: 15px;
    padding: 12px 20px;

    background: #20a05a;
    color: white;

    text-decoration: none;
    border-radius: 10px;

    font-size: 15px;
    font-weight: 600;

    transition: 0.2s ease;
}

.add-task-btn:hover {
    background: #178548;
    transform: translateY(-2px);
}
.logout-form {
    position: fixed;
    top: 25px;
    right: 30px;
}

.logout-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 10px;

    background: #ef4444;
    color: white;

    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition: 0.25s;
}

.logout-btn:hover {
    background: #dc2626;
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(239, 68, 68, 0.25);
}
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>My Tasks</h1>
        <p>Keep track of your daily tasks</p>
    </div>

    <div class="task-list">

        {% for task in tasks %}

    <div class="task {% if task.status %}completed{% endif %}">

        <span class="task-title">
            {{ task.title }}
        </span>

        <div class="actions">

            <form method="post" action="{% url 'tasks:done_task' task.pk %}">
                {% csrf_token %}

                <button type="submit"
                        class="action-btn done-btn"
                        title="Done">
                    ✓
                </button>
            </form>

           <form method="post" action="{% url 'tasks:delete_task' task.pk %}">
                {% csrf_token %}

                <button type="submit"
                        class="action-btn delete-btn"
                        title="Delete">
                    🗑
                </button>
            </form>
           
        </div>

    </div>

{% empty %}

    <div class="empty">
        <p>No tasks yet 🎉</p>
    </div>

{% endfor %}
    </div>
     <a href="{% url 'tasks:create_task' %}" class="add-task-btn">
                + Add New Task
            </a>
</div>
<form method="post" action="{% url 'logout' %}" class="logout-form">
    {% csrf_token %}
    <button type="submit" class="logout-btn">
        Logout
    </button>
</form>
</body>
</html>
