<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Task</title>

    <style>
        * {box-sizing: border-box;}

        body { margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f4f6f8;}
          
        .task-card {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);}

        .task-card h1 {
            margin: 0 0 8px;
            font-size: 28px;
            color: #222; }

        .task-card p {
            margin-bottom: 25px;
            color: #777;}

        .form-group {
            margin-bottom: 20px;}

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;}

        .form-group input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;}

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);}

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;}

        .submit-btn:hover {
            background: #4338ca;}

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #666;
            text-decoration: none;
            font-size: 14px;}

        .back-link:hover {
            color: #4f46e5;}
    </style>
</head>

<body>

<div class="task-card">

    <h1>Create a Task ✨</h1>

    <p>Add a new task to your to-do list.</p>

    <form method="post">

        {% csrf_token %}

        <div class="form-group">
            <label for="id_title">Task title</label>

            {{ form.title }}
        </div>

        <button type="submit" class="submit-btn">
            Add Task
        </button>

    </form>

    <a href="{% url 'tasks:task_list' %}" class="back-link">
        ← Back to tasks
    </a>

</div>

</body>
</html>
