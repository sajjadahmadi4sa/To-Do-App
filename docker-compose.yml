
services:
  backend:
    build: .
    # container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=True
    depends_on:
      - smtp4dev

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: todo_smtp4dev
    restart: on-failure
    ports:
      - "127.0.0.1:2526:25"
      - "127.0.0.1:5001:80"
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__Urls=http://*:80
      - ServerOptions__HostName=smtp4dev

volumes:
  smtp4dev-data:
